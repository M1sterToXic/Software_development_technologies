name: high_grade_project
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    command: python ./server.py
    ports:
      - "1235:1234"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1234/')"]
      interval: 5s
      timeout: 5s
      retries: 5

  client:
    build: ./client
    command: python ./client.py
    depends_on:
      server:
        condition: service_healthy

  blas_bench:
    build: ./blas_tests
    depends_on:
      db:
        condition: service_healthy